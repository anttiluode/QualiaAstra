name: Validate mechanism and viewer
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: npm install --prefix /tmp/qualia-ui --no-save --package-lock=false playwright
      - run: /tmp/qualia-ui/node_modules/.bin/playwright install --with-deps chromium
      - run: node tests/gate2.cjs
      - run: node tests/gate3.cjs
      - run: node tests/gate3_confirm.cjs
      - run: node tests/gate4.cjs
      - run: node tests/gate4_confirm.cjs
      - run: node tests/gate5.cjs
      - run: node tests/gate5_confirm.cjs
      - run: NODE_PATH=/tmp/qualia-ui/node_modules node tests/browser_smoke.cjs
      - run: NODE_PATH=/tmp/qualia-ui/node_modules node tests/gate2_browser.cjs
      - run: NODE_PATH=/tmp/qualia-ui/node_modules node tests/gate3_browser.cjs
      - run: NODE_PATH=/tmp/qualia-ui/node_modules node tests/gate4_browser.cjs
      - run: NODE_PATH=/tmp/qualia-ui/node_modules node tests/gate5_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewer-screenshots
          path: /tmp/qualia-*.png
